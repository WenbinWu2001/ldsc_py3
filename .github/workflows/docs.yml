# Build the documentation site on every push and pull request; publish it to
# GitHub Pages from the default branch only.
name: Documentation

on:
  push:
    branches: [restructure]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: setup.py
      - name: Install the package with the documentation tools
        run: python -m pip install -e ".[docs]"
      - name: Build the site, failing on any warning
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/restructure' && github.event_name != 'pull_request'
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/restructure' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
