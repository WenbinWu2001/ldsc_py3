   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172c3c" x="43.2" y="51.276562" transform="rotate(-0 43.2 51.276562)">Direct LD scoring to partitioned regression</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #496273" x="43.2" y="78.290625" transform="rotate(-0 43.2 78.290625)">Current module boundaries and canonical artifacts  |  2026-10-15</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2d658f" x="60.48" y="132.357656" transform="rotate(-0 60.48 132.357656)">Annotation inputs</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 163.860781)">Baseline .annot(.gz) + optional query tables</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 182.835781)">or BED / resolved gene intervals</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 202.924844)">AnnotationBuilder -&gt; chromosome shards</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 220.625859)">iter_bed_rows -&gt; ChromosomeProjector</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2d658f" x="466.56" y="132.357656" transform="rotate(-0 466.56 132.357656)">Reference inputs</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(466.56 163.860781)">PLINK: --plink-prefix</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(466.56 182.835781)">or canonical R² parquet: --r2-dir</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(466.56 201.810781)">Resolved paths and chromosome scope</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(466.56 220.785781)">Shared identity and genome-build policy</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2b7563" x="60.48" y="309.477656" transform="rotate(-0 60.48 309.477656)">1. Prepare one chromosome</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 340.820859)">RefPanel.prepare_chromosome() -&gt; PreparedChromosome</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 359.955781)">Align annotation/reference rows; apply reference QC, restrictions and LD windows.</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 378.930781)">Own the PLINK/R² reader and preserve physical PLINK row mapping.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2b7563" x="60.48" y="473.637656" transform="rotate(-0 60.48 473.637656)">2. Compute direct LD scores</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 504.980859)">LDScoreCalculator.compute_chromosome() -&gt; _kernel.ldscore.compute_chromosome()</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 524.115781)">Accumulate LD scores, annotation counts and overlaps in float64.</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 543.090781)">Workers stage float32 query fragments; the parent combines chromosome results.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #9a602b" x="60.48" y="637.797656" transform="rotate(-0 60.48 637.797656)">3. Publish the canonical LD-score directory</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 669.140859)">LDScoreDirectoryWriter.write_batches() (also used by indexed scoring)</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 688.275781)">metadata.json + ldscore.baseline.parquet + ldscore.overlap.parquet when required</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 707.250781)">Optional query files: ldscore.query.parquet or ldscore.query.batchNNNNN.parquet</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 726.225781)">Ordered query manifest in metadata.json; chromosome row groups in baseline/query tables.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2d658f" x="60.48" y="819.237656" transform="rotate(-0 60.48 819.237656)">4. Open saved LD scores</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 850.580859)">load_ldscore_from_dir() -&gt; LDScoreSource</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 869.555859)">Owner: ldscore_source.py</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 888.690781)">Shared baseline, identities, counts, overlap</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 907.505859)">read_queries(names): uncached selections</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2d658f" x="466.56" y="819.237656" transform="rotate(-0 466.56 819.237656)">Munge or load GWAS sumstats</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(466.56 850.580859)">SumstatsMunger / load_sumstats()</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(466.56 869.715781)">Curated Parquet or legacy .sumstats(.gz)</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(466.56 889.218164)">Canonical identities, Z, N and allele metadata</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(466.56 907.665781)">Validated SumstatsTable for trait alignment</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2b7563" x="60.48" y="983.397656" transform="rotate(-0 60.48 983.397656)">5. Fit and write partitioned heritability</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 1014.740859)">RegressionRunner -&gt; _kernel.regression.Hsq</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 1033.875781)">Fit the complete baseline model, or one baseline-plus-query model per query.</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #172c3c" transform="translate(60.48 1052.690859)">PartitionedH2DirectoryWriter -&gt; partitioned_h2.tsv + diagnostics/</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #496273" x="43.2" y="1124.038406" transform="rotate(-0 43.2 1124.038406)">Counts and overlap use retained reference SNPs; regression rows and weights use a separate filtered universe.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #496273" x="43.2" y="1143.910406" transform="rotate(-0 43.2 1143.910406)">Public annotation reads and saved LD scores are float32. Numerical accumulation remains float64.</text>
   </g>
  </g>
 </g>
 <defs>
  <clipPath id="p7201c14976">
   <rect x="0" y="0" width="864" height="1157.76"/>
